name: Build Recoveries (Motorola g84 bangkk)

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      products:
        description: 'Select products to build'
        required: false
        type: choice
        options:
          - 'All products'
          - 'TWRP'
          - 'PBRP'
          - 'SHRP'
          - 'OFOX'
        default: 'All products'
      clean_build:
        description: 'Clean build'
        required: false
        type: boolean
        default: false

env:
  DEVICE_TREE_URL: https://github.com/humandroid-2002/device_motorola_bangkk_twrp.git
  DEVICE_PATH: device/motorola/bangkk
  DEVICE_NAME: bangkk

  TWRP_MANIFEST: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
  PBRP_MANIFEST: https://github.com/PitchBlackRecoveryProject/manifest_pb.git
  SHRP_MANIFEST: https://github.com/SHRP-Reborn/manifest.git
  ORANGEFOX_SYNC: https://gitlab.com/OrangeFox/sync.git

jobs:
  setup:
    name: 🧩 Setup Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set matrix
        id: set-matrix
        run: |
          if [ "${{ github.event.inputs.products }}" == "All products" ]; then
            echo 'matrix=["TWRP", "PBRP", "SHRP", "OFOX"]' >> $GITHUB_OUTPUT
          else
            echo 'matrix=["${{ github.event.inputs.products }}"]' >> $GITHUB_OUTPUT
          fi

  notify_workflow:
    name: 📢 Notify Build Start
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Notification
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F message_thread_id="${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}" \
            -F text="
            🚀 Build started for Motorola bangkk!
            📦 *Repository:* [${{ github.repository }}](https://github.com/${{ github.repository }})
            🗂️ *Products:* ${{ github.event.inputs.products }}
            🎯 *Device:* bangkk
            ✏️ *Commit:* [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            [🔗 View GitHub Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
            -F parse_mode="Markdown"

  build_twrp:
    name: 💥 Build TWRP
    needs: [setup, notify_workflow]
    runs-on: ubuntu-latest
    timeout-minutes: 480
    if: ${{ contains(needs.setup.outputs.matrix, 'TWRP') }}

    steps:
      - name: Free up system space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Configure swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -o ~/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          chmod +x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Setup build environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git aria2 ccache
          git clone --depth=1 https://gitlab.com/OrangeFox/misc/scripts ~/scripts
          cd ~/scripts
          sudo bash setup/android_build_env.sh
          sed -i 's/cd -/cd ../g' setup/install_android_sdk.sh
          sudo bash setup/install_android_sdk.sh
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global color.ui true

      - name: Make directories
        run: |
          mkdir -p $HOME/twrp-12.1
          mkdir -p $HOME/files

      - name: Initialize TWRP source
        run: |
          cd $HOME/twrp-12.1
          repo init -u $TWRP_MANIFEST -b twrp-12.1 --depth=1

      - name: Sync TWRP source
        run: |
          cd $HOME/twrp-12.1
          repo sync -j$(nproc --all) --force-sync --no-tags --no-clone-bundle

      - name: Clone device tree (bangkk)
        run: |
          cd $HOME/twrp-12.1
          git clone --depth=1 --branch 12.1 $DEVICE_TREE_URL $DEVICE_PATH

      - name: Setup ccache
        if: github.event.inputs.clean_build != 'true'
        run: |
          export USE_CCACHE=1
          export CCACHE_DIR=~/.ccache
          ccache -M 8G
          ccache -z

      - name: Build TWRP bootimage
        run: |
          cd $HOME/twrp-12.1
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_bangkk-eng
          if [[ "${{ github.event.inputs.clean_build }}" == "true" ]]; then
            make clean
          fi
          mka bootimage -j$(nproc --all)

      - name: Package TWRP boot.img
        run: |
          OUT=$HOME/twrp-12.1/out/target/product/$DEVICE_NAME
          mkdir -p $HOME/files
          cp "$OUT/boot.img" "$HOME/files/TWRP-${DEVICE_NAME}-boot-${{ github.run_id }}.img"

      - name: Create GitHub Release (TWRP)
        uses: softprops/action-gh-release@v2
        with:
          files: /home/runner/files/TWRP-*.img
          name: "TWRP bangkk - ${{ github.run_id }}"
          tag_name: "twrp-bangkk-${{ github.run_id }}"
          body: |
            ###📱 TWRP Recovery Build (bangkk)

            ### ⚙️ Build Info
            - Manifest Branch: `12.1`
            - Device: `bangkk`
            - Build Target: `bootimage`
            - Device Tree: [`12.1`](${{ env.DEVICE_TREE_URL }})
            - Build Date: ${{ github.event.head_commit.timestamp }}
            - Workflow Run: [#${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ### 🆕 New Features
            - **Added AnyKernel support** for both **AOSP** and **StockOS**
            - Fully compatible with **EROFS** and **EXT4** partitions
            - Additional 50mb Free space to 40mb to prevent issues on future AK3 Updates.

            ### ⚠️ Important Note for EROFS Users
            EROFS-based ROMs, **Only first boot after fastboot boot TouchScreen are intentionally Disabled for 40 sec**.  
            **Please wait until the Recovery Give you Touch Control.(40sec). 
            For you're Device safety Do not force reboot or interrupt the recovery.  

            ### 📂 Output
            - boot.img

            ### Flash Instructions
            1. ⚡ `fastboot boot boot.img`
            2. 🔧 From Recovery Go to Advance Setting and Select Flash Current Recovery (REQUIRED!!!)
            3. 🔁 Reboot to recovery (REQUIRED!!!)
            4. ✅ Done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_pbrp:
    name: 💥 Build PBRP
    needs: [setup, notify_workflow]
    runs-on: ubuntu-latest
    timeout-minutes: 480
    if: ${{ contains(needs.setup.outputs.matrix, 'PBRP') }}

    steps:
      - name: Free up system space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
